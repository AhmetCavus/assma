server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${ASSMA_API_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Fingerprinted build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;

    # nginx's mime.types has no .mjs; with nosniff the pdf.js module worker would not start.
    location ~ \.mjs$ {
      types { }
      default_type text/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${ASSMA_API_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
